# Builds the static site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The base path and site URL come from the Pages settings: with a custom domain
# (e.g. pocketpec.space) the site is built for the domain root, otherwise for
# https://<user>.github.io/<repo>/. Re-run this workflow after changing the domain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional, set as repository variables (Settings -> Secrets and variables -> Actions):
      NEXT_PUBLIC_GOOGLE_PLAY_URL: ${{ vars.GOOGLE_PLAY_URL }}
      NEXT_PUBLIC_APP_STORE_URL: ${{ vars.APP_STORE_URL }}
      NEXT_PUBLIC_DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      NEXT_PUBLIC_APK_URL: ${{ vars.APK_URL }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
